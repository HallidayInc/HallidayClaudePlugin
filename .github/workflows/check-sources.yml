name: Check source freshness

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-sources-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Fetch live sources
        run: bash scripts/update-sources.sh

      - name: Compare with committed sources
        run: |
          if git diff --quiet sources/ BUILD_META.json; then
            echo "Sources are up to date."
          else
            echo "::error::Source files are stale. Run 'bash scripts/update-sources.sh' and commit the changes."
            echo ""
            echo "=== Changed files ==="
            git diff --stat sources/ BUILD_META.json
            echo ""
            echo "=== Full diff ==="
            git diff sources/ BUILD_META.json
            echo ""
            echo "To fix:"
            echo "  bash scripts/update-sources.sh"
            echo "  git add sources/ BUILD_META.json"
            echo "  git commit -m 'Update raw source files'"
            exit 1
          fi

      - name: Validate links and endpoints
        run: bash scripts/validate-links.sh
